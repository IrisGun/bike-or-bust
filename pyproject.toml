[project]
name = "bike-or-bust"
version = "0.1.0"
description = "Production-style pipeline forecasting bike-share station stock-outs (Citi Bike GBFS)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.125",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "matplotlib>=3.11.2",
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bike_or_bust"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
